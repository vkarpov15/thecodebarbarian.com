<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SSE EventSource Test</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    #output { border: 1px solid #ccc; padding: 12px; min-height: 120px; font-family: monospace; white-space: pre-wrap; }
    button { padding: 8px 16px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>SSE EventSource Test</h1>
  <button id="start">Start streaming</button>
  <div id="output"></div>

  <script>
    const output = document.getElementById('output');

    function log(line) {
      output.textContent += line + '\n';
    }

    function run() {
      output.textContent = '';

      // EventSource is the browser's built-in SSE client. It handles the
      // `data: ` / `\n\n` parsing for us, so we just listen for messages.
      const source = new EventSource('http://localhost:3000/sse');

      source.onmessage = event => {
        log(new Date().toISOString() + ' received: ' + event.data);
      };

      // Note: unlike a manual `fetch`, EventSource can only issue a GET and
      // cannot set custom headers (e.g. `Authorization`). It also auto-reconnects,
      // so the server closing the stream triggers `onerror` rather than a clean
      // end. Close the connection ourselves once we've received all the words.
      source.onerror = () => {
        log('Stream closed');
        source.close();
      };
    }

    document.getElementById('start').addEventListener('click', run);
  </script>
</body>
</html>
